<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 필수: 이 태그가 없으면 폰에서 PC용 화면처럼 축소되어 터치가 스크롤/확대로 해석됨 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>과제 모음</title>
    <style>
      /* 허브 페이지는 절대 스크롤/선택되지 않게 고정 (아이폰에서 터치가 페이지 스크롤로 새는 것 방지) */
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: sans-serif;
      }
      /* 왼쪽 메뉴 */
      #menu {
        position: fixed;
        top: 0;
        left: 0;
        width: 100px;
        height: 100%;
        padding: 60px 20px 20px; /* ★ 위쪽 60px은 토글 버튼 자리 */
        box-sizing: border-box;
        background: #fff;
        z-index: 10; /* ★ */
        transition: transform 0.3s ease; /* ★ 부드럽게 들어가고 나오게 */
      }
      #menu a {
        display: block;
        margin-bottom: 10px;
        cursor: pointer;
        color: blue;
      }
      /* iframe 영역: 메뉴(100px)를 뺀 나머지 화면 전체 */
      #stage {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 100px;
        overflow: hidden;
        transition: left 0.3s ease; /* ★ */
      }
      #viewer {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* ★ 메뉴가 닫힌 상태: body에 menu-closed 클래스가 붙으면 적용 */
      body.menu-closed #menu {
        transform: translateX(-100%); /* 메뉴를 자기 너비만큼 왼쪽 화면 밖으로 */
      }
      body.menu-closed #stage {
        left: 0; /* iframe이 화면 전체를 차지 */
      }

      /* ★ 토글 버튼 (항상 왼쪽 위에 떠 있음) */
      #menuToggle {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 20; /* 메뉴보다 위에 */
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        font-size: 18px;
        cursor: pointer;
        touch-action: manipulation; /* 아이폰 더블탭 확대 방지 */
      }
    </style>
  </head>
  <body>
    <!-- ★ 토글 버튼 -->
    <button id="menuToggle" onclick="toggleMenu()" aria-label="메뉴 열기/닫기">☰</button>

    <div id="menu">
      <!--<a onclick="loadHomework('Homework1')">Homework1</a>
      <a onclick="loadHomework('Homework2')">Homework2</a>
      <a onclick="loadHomework('Homework3')">Homework3</a>
    -->
      <a onclick="loadHomework('Dynamic_Balance')">Dynamic-Balance</a>
      <a onclick="loadHomework('Delete_Delete_Delete')">Delete-Delete-Delete</a>
      <a onclick="loadHomework('chameul-in')">cham-eul-in-memo</a>
      <a onclick="loadHomework('seojin-care')">seojin-care</a>
    </div>

    <div id="stage">
      <!-- 처음 열었을 때 보여줄 과제 -->
      <iframe id="viewer" src="seojin-care/index.html"></iframe>
    </div>

    <script>
      // 메뉴 클릭 시 iframe에 해당 폴더의 index.html을 불러옴
      function loadHomework(folderName) {
        document.getElementById("viewer").src = folderName + "/index.html";
      }

      // ★ 버튼 누를 때마다 body에 menu-closed 클래스를 붙였다 뗐다 함
      function toggleMenu() {
        document.body.classList.toggle("menu-closed");
      }
    </script>
  </body>
</html>
